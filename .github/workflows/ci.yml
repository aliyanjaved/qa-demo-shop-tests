name: tests

on: [push, pull_request]

jobs:
  tests-clean-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: mkdir -p reports
      - name: Run all tests
        run: ./run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  # Demonstration job: the suite SHOULD fail here because the app has seeded defects.
  tests-seeded-bugs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: mkdir -p reports
      - name: Run tests against app with seeded defects (expected to fail)
        run: ./run_tests.sh --bugs
