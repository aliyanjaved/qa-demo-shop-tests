<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo Shop - Login</title></head>
<body>
<h1>Login</h1>
{% if error %}<p data-test="login-error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <label>Username <input name="username" data-test="username"></label><br>
  <label>Password <input name="password" type="password" data-test="password"></label><br>
  <button type="submit" data-test="login-button">Login</button>
</form>
</body></html>
